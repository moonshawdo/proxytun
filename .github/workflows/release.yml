# Manual release: Actions -> Release -> Run workflow, on main, with the
# version from Cargo.toml (no leading v). Builds the static musl binary,
# runs the unit tests, checks the binary, then publishes release vX.Y.Z
# with the binary and SHA256SUMS; the notes are the version's section of
# CHANGELOG.md. Any failed check stops it before anything is published.
# The end-to-end tests need namespaces and a TUN device the runner may
# not grant: run them locally before releasing.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0); must equal Cargo.toml"
        required: true
        type: string

permissions:
  contents: write

# One release at a time; never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      TARGET: x86_64-unknown-linux-musl
      # The toolchain proxytun is developed and tested on.
      RUST_VERSION: "1.99.1"
      BIN: dist/proxytun-x86_64-linux-musl
    steps:
      - uses: actions/checkout@v5
        with:
          # All history and tags: the notes link back to the previous tag.
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version: $VERSION"
            exit 1
          fi
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c '
          import json, sys
          print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "proxytun"))')
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $cargo_version: bump it to $VERSION first"
            exit 1
          fi
          # The tag is created at this commit; an existing one would pair an
          # old commit with a binary built from this one. --exit-code: 0 found,
          # 2 not found, anything else is a failed query, which stops us too.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          elif [ "$rc" != 2 ]; then
            echo "::error::could not list the tags (git ls-remote exit $rc)"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          notes="$RUNNER_TEMP/notes.md"
          base="https://github.com/$GITHUB_REPOSITORY"
          dl="$base/releases/download/v$VERSION"
          # The "## vX.Y.Z" section (its heading may go on, e.g. with a date),
          # up to the next "## " heading.
          awk -v want="## v$VERSION" '
            /^## / { if (found) exit; found = ($0 == want || index($0, want " ") == 1); next }
            found
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## v$VERSION' section, or it is empty"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changes="$base/compare/$prev...v$VERSION"
          else
            changes="$base/commits/v$VERSION"
          fi
          cat >> "$notes" <<EOF

          ## Downloads

          | Platform | File |
          |---|---|
          | Linux x86-64, any glibc (CentOS 7 included) | [proxytun-x86_64-linux-musl]($dl/proxytun-x86_64-linux-musl) |
          | SHA-256 checksums | [SHA256SUMS]($dl/SHA256SUMS) |

          \`\`\`bash
          curl -LO $dl/proxytun-x86_64-linux-musl
          curl -LO $dl/SHA256SUMS
          sha256sum -c SHA256SUMS
          sudo install -o root -g root -m 0755 proxytun-x86_64-linux-musl /usr/local/bin/proxytun
          proxytun --doctor
          \`\`\`

          ## FAQ

          Run \`proxytun --doctor\` first, then see Troubleshooting:
          [English]($base/blob/v$VERSION/docs/README_en.md#troubleshooting) · [中文]($base/blob/v$VERSION/README.md#排错)

          **Full Changelog**: $changes
          EOF
          cat "$notes"

      - name: Unit tests
        run: cargo test --locked --target "$TARGET" --workspace --lib --bins

      - name: Build the static binary
        run: |
          ./scripts/build-static.sh
          if ! file "$BIN" | grep -q 'static'; then
            echo "::error::$BIN is not statically linked: $(file "$BIN")"
            exit 1
          fi
          reported=$("$BIN" --version)
          if [ "$reported" != "proxytun $VERSION" ]; then
            echo "::error::the binary reports '$reported'"
            exit 1
          fi
          (cd dist && sha256sum proxytun-x86_64-linux-musl > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$BIN" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "proxytun $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
