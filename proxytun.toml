# proxytun config. Only [[proxies]] is required; everything else is shown
# commented out with its default. A proxyhook.toml works as is: keys proxytun
# has no use for are reported at start-up and ignored. The one exception is a
# fake_ip_range narrower than /22 (see below).
# Top-level keys must come before any [table] in TOML, so they are all here.

# --- fake-ip DNS ---------------------------------------------------------
# Domains the program resolves get an address from this range, which is how
# the real hostname survives until the proxy. Its last /24 holds proxytun's
# own addresses (TUN device, DNS server), so the prefix must be /8 to /22.
# fake_ip_range = "198.18.0.0/15"

# Where MX/TXT/PTR/... queries (everything but A records) are forwarded, from
# the host. Default: the first nameserver of the host's /etc/resolv.conf.
# upstream_dns = "1.1.1.1:53"

# --- direct instead of proxied -------------------------------------------
# Literal-IP destinations reached straight from the host, no rules, no proxy
# (like proxychains' localnet). The proxies named in the program's own
# http_proxy / https_proxy / all_proxy are added automatically. Default empty.
# localnet = ["10.0.0.0/8", "192.168.0.0/16"]

# The program's own connections to one of the [[proxies]] below (same ip and
# port: its own proxy setting, `curl -x`) go direct instead of through the
# proxy a second time. Unlike localnet, only that port: other ports of the
# proxy's host still follow the rules.
# direct_to_proxies = true

# --- hostname sniffing ----------------------------------------------------
# For connections to a bare IP (DoH, hard-coded addresses, names resolved
# through nscd / systemd-resolved), read the hostname from the TLS SNI or HTTP
# Host of the first bytes. Fine-tuning (sniff_ports, sniff_skip_domains,
# sniff_timeout_ms, sniff_override_destination): see docs/CONFIG.md.
# sniff = true

# --- the host's own loopback services -------------------------------------
# The namespace's 127.0.0.1 is its own. The host's loopback TCP listeners found
# at start-up are forwarded into it; exclude ports the program listens on itself.
# host_ports_forward = true
# host_ports_exclude = []

# --- several proxies (see [[groups]] below) --------------------------------
# Other group members to try when a proxy handshake fails.
# retries = 2

# --- connecting out --------------------------------------------------------
# How long a TCP connect may take, in milliseconds: to a proxy, to a
# destination reached directly (direct rules, localnet), and to a forwarded
# host port. Past it the program's connection is reset rather than left
# hanging (on its own the kernel retries for about two minutes, all the while
# holding a relay slot), and a proxy that did not accept counts as failing:
# the next group member is tried (see retries). Range 100 to 60000; taken up
# on SIGHUP. Too short, and connections to distant proxies fail.
# connect_timeout_ms = 5000

# --- upstream proxy -------------------------------------------------------
# The address can be overridden at run time with --proxy URL or $PROXYTUN_PROXY.
# proxytun dials it from the host, so 127.0.0.1 here means the host.
[[proxies]]
name = "clash"
type = "socks5"                  # "socks5" (domain sent as ATYP=3) or "http" (CONNECT host:port)
addr = "172.25.32.1:7897"
# username = "user"
# password = "pass"

# --- several proxies --------------------------------------------------------
# Without [[groups]], all proxies form the group "default". To balance them:
# strategy = round-robin | random | least-conn | least-latency |
#            weighted-round-robin (weight = n on each proxy) | hash (same domain -> same proxy)
# [[groups]]
# name = "default"
# strategy = "round-robin"
# members = ["clash", "backup"]
#
# Health checks, used to skip proxies that are down:
# [health]
# interval_secs = 10
# fail_threshold = 3
# timeout_ms = 3000

# --- rules, first match wins ------------------------------------------------
# proxytun's own routing; with Clash deciding for you, usually none are needed.
# Domain rules fire when the program resolved the name through our DNS (or the
# name was sniffed); ip-cidr rules fire when it dialed a literal IP. Without a
# matching rule, connections go through the group "default" (never direct).
# match:  domain-suffix | domain-keyword | domain | ip-cidr | final
# action: proxy | direct | block      (proxy accepts group = "<name>")
#
# Example: uncomment to send the LAN, .cn domains and baidu straight out and
# everything else through the proxy.
# [[rules]]
# match  = "ip-cidr"
# value  = "192.168.0.0/16"
# action = "direct"
#
# [[rules]]
# match  = "domain-suffix"
# value  = "cn"
# action = "direct"
#
# [[rules]]
# match  = "domain-keyword"
# value  = "baidu"
# action = "direct"
#
# [[rules]]
# match  = "final"
# action = "proxy"
