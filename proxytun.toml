# proxytun example config.
# Top-level keys must come before any [table] in TOML, so they are all here.
# A proxyhook.toml works as is: keys proxytun has no use for are reported at
# start-up and ignored.

# --- fake-ip DNS ---------------------------------------------------------
# Domains the program resolves get an address from this pool, which is how the
# real hostname survives until the proxy. The last /24 of the range is kept
# for proxytun's own addresses inside the namespace (the TUN device, the DNS
# server), so the prefix must be between /8 and /22.
fake_ip_range = "198.18.0.0/15"

# Used to answer non-A queries (MX/TXT/...) and nothing else. Must be ip:port.
# Reached directly from the host, not through the proxy.
upstream_dns = "1.1.1.1:53"

# --- behaviour switches --------------------------------------------------
# Destinations reached directly from the host instead of through the proxy
# (like proxychains' "localnet"). The proxy endpoints named in the program's
# own http_proxy / https_proxy / all_proxy variables are added automatically.
# Add your LAN here if it should bypass the proxy, e.g.
#   localnet = ["10.0.0.0/8", "192.168.0.0/16"]
# (127.0.0.0/8 inside the namespace is the namespace's own loopback; it never
# reaches proxytun.)
localnet = ["127.0.0.0/8"]

# Recover the hostname of connections to a bare IP by peeking at the first
# bytes the program sends (TLS SNI / HTTP Host). This catches programs that
# bypass our DNS, e.g. Chrome with "Secure DNS" (DoH) or hard-coded addresses.
# Ports not listed in sniff_ports are never delayed.
sniff = true
sniff_ports = [80, 443, 8443]
# Names that are NOT the real destination: the "public name" shown by a real
# ECH (Encrypted Client Hello) connection. Chrome adds an ECH extension to every
# hello as GREASE, so ECH cannot be used as a signal; matching names (and their
# subdomains) keep the plain IP instead.
sniff_skip_domains = ["cloudflare-ech.com"]
# How long to wait for the program's first bytes before keeping the plain IP.
sniff_timeout_ms = 300

# When a proxy handshake fails, try up to this many other members of the group
# before giving up (and closing the connection - it never falls back to direct).
retries = 2

# Active health checks of the upstream proxies.
[health]
interval_secs = 10   # probe every proxy this often
fail_threshold = 3   # consecutive failures before a proxy is marked DOWN
timeout_ms = 3000

# --- upstream proxies ----------------------------------------------------
# Several can be listed and balanced; see [[groups]].
# The address can be overridden at run time with --proxy URL or $PROXYTUN_PROXY.
# proxytun dials the proxy from the host, so 127.0.0.1 here means the host.
[[proxies]]
name = "clash"
type = "socks5"                  # "socks5" (domain sent as ATYP=3) or "http" (CONNECT host:port)
addr = "172.25.32.1:7897"
# username = "user"
# password = "pass"
# weight = 1                     # used by weighted-round-robin

# A second proxy, to try load balancing:
# [[proxies]]
# name = "backup"
# type = "http"
# addr = "10.0.0.5:8080"
# weight = 2

# --- proxy groups (load balancing) ---------------------------------------
# strategy: round-robin | random | least-conn | least-latency |
#           weighted-round-robin | hash (same domain -> same proxy)
# A group named "default" is required; rules without `group` use it.
[[groups]]
name = "default"
strategy = "round-robin"
members = ["clash"]

# --- routing rules, first match wins ------------------------------------
# match:  domain-suffix | domain-keyword | domain | ip-cidr | final
# action: proxy | direct | block      (proxy accepts group = "<name>")
# Domain rules fire when the program resolved the name through our DNS;
# ip-cidr rules fire when it dialed a literal IP. With no `final` rule,
# unmatched connections go through the default group (never direct).
[[rules]]
match  = "ip-cidr"
value  = "192.168.0.0/16"
action = "direct"

[[rules]]
match  = "domain-suffix"
value  = "cn"
action = "direct"

[[rules]]
match  = "domain-keyword"
value  = "baidu"
action = "direct"

[[rules]]
match  = "final"
action = "proxy"
