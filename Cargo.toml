[workspace]
resolver = "2"
members = ["crates/proxytun-core", "crates/proxytun"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[workspace.dependencies]
proxytun-core = { path = "crates/proxytun-core" }
nix = { version = "0.31", features = ["sched", "mount", "user", "socket", "uio"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
ipnet = "2"
hickory-proto = "0.24"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_ignored = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
